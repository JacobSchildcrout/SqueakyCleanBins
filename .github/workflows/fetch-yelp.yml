name: Fetch Yelp Data

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  fetch-yelp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Yelp business + reviews
        env:
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
        run: |
          echo "Fetching business details..."
          HTTP_STATUS=$(curl -s -w "%{http_code}" -H "Authorization: Bearer $YELP_API_KEY" \
            "https://api.yelp.com/v3/businesses/squeaky-clean-powerwashing-dallas" \
            -o /tmp/biz.json)
          echo "Business endpoint status: $HTTP_STATUS"
          cat /tmp/biz.json
          if [ "$HTTP_STATUS" != "200" ]; then exit 1; fi

          node -e "
            const biz = require('/tmp/biz.json');
            const data = {
              rating: biz.rating,
              review_count: biz.review_count,
              url: biz.url,
              updated: new Date().toISOString()
            };
            process.stdout.write(JSON.stringify(data, null, 2));
          " > yelp-data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yelp-data.json
          git diff --staged --quiet || git commit -m "chore: refresh Yelp data"
          git push
